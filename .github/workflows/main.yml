name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Show vendor contents (debug)
        run: |
          echo "== vendor directory listing =="
          ls -la vendor || echo "vendor directory not present"

      - name: Create Release Archive
        run: |
          echo "Creating release.zip (including vendor)"
          # show vendor so it's clear whether files are present before zipping
          echo "Vendor preview:"
          ls -la vendor | sed -n '1,50p' || true
          # create the archive from the working directory, excluding git and workflow files and tests
          zip -r release.zip . -x ".git/*" ".github/*" "tests/*" "phpunit.xml*"
          echo "Archive created. Listing contents (first 200 lines):"
          unzip -l release.zip | sed -n '1,200p'

      - name: Create a Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          files: release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
